[project]
name = "caldav-mcp"
version = "0.1.0"
description = "MCP server for CalDAV calendar integration (read/write events), Streamable HTTP transport"
requires-python = ">=3.11"
dependencies = [
    "icalendar==7.2.2",
    "caldav==3.2.1",
    "fastmcp==3.4.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[project.scripts]
caldav-mcp = "server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
