[project]
name = "caldav-mcp"
version = "0.1.0"
description = "MCP server for CalDAV calendar integration (read/write events), Streamable HTTP transport"
requires-python = ">=3.11"
dependencies = [
    "caldav>=1.3.7",
    "fastmcp>=3.4.0",
]

[project.scripts]
caldav-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
