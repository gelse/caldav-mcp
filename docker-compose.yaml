services:
  caldav-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: caldav-mcp:latest
    container_name: caldav-mcp
    restart: unless-stopped
    ports:
      - "8600:8080"
    environment:
      CALDAV_MCP_PORT: "8080"
      CALDAV_MCP_PATH: "/mcp"
      # Shared API token; set in a local .env file or host environment.
      CALDAV_MCP_API_KEY: "${CALDAV_MCP_API_KEY:-}"
      TZ: Europe/Vienna
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
