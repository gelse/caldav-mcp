name: Docker Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: caldav-mcp:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts
        run: |
          docker rm -f test-container 2>/dev/null || true
          docker run -d --name test-container \
            -e CALDAV_MCP_PORT=8080 \
            -e CALDAV_MCP_PATH=/mcp \
            -e TZ=UTC \
            caldav-mcp:ci-${{ github.sha }}
          sleep 5
          docker exec test-container python3 -c \
            "import socket; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8080)); s.close()"
          docker stop test-container
