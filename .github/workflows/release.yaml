name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.1.0). Leave empty to auto-detect from GITHUB_REF."
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        run: |
          # Priority: input > GITHUB_REF > latest tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${GITHUB_REF#refs/tags/}" ] && [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            echo "ERROR: Could not determine tag name"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Detected tag: $TAG"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Verify version matches pyproject.toml
        run: |
          PKG_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$PKG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: Tag version (${{ steps.version.outputs.version }}) != pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(awk "/^## v${VERSION}/,/^## v[0-9]/" CHANGELOG.md | head -n -1 | tail -n +2)
          NOTES_JSON=$(echo "$NOTES" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))")
          echo "body=$NOTES_JSON" >> "$GITHUB_OUTPUT"

      - name: Create Forgejo release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          curl -sS -f -X POST \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\": \"${TAG}\", \"name\": \"Release ${TAG}\", \"body\": ${{ steps.notes.outputs.body }}, \"draft\": false, \"prerelease\": false}"
